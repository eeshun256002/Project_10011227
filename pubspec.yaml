publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.1.1
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
